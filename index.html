<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cartes Alif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Concept : cahier d'école bleu nuit. Cinq phases, cinq couleurs. Un bandeau de semaines, des jours J1 à J6,
   une grande carte qui se retourne, une fiche de séance B et neuf jeux. */
:root {
  --bg: #EEF3FA;
  --surface: #FFFFFF;
  --surface-2: #E3EBF6;
  --ink: #14213D;
  --ink-soft: #4A5878;
  --line: #CBD7EA;
  --good: #1E9E6A;
  --bad: #D6455D;
  --teal: #12A4A0;   --teal-soft: #D5F1EF;
  --violet: #7A5CE0; --violet-soft: #E6E0FA;
  --coral: #EE5A4F;  --coral-soft: #FCE0DC;
  --gold: #E7A400;   --gold-soft: #FBEFC8;
  --sky: #2F7DE1;    --sky-soft: #DCEAFE;
  --phase: var(--teal);
  --phase-soft: var(--teal-soft);
  --on-phase: #FFFFFF;
  --shadow: 0 6px 0 rgba(20, 33, 61, .12);
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar: "Scheherazade New", "Noto Naskh Arabic", "Amiri", "Geeza Pro", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1630; --surface: #18244A; --surface-2: #213059; --ink: #EEF2FF; --ink-soft: #A9B6D8; --line: #2D3C69;
    --good: #43D39A; --bad: #FF7A8E;
    --teal: #3CCFC9; --teal-soft: #17433F; --violet: #A58EFF; --violet-soft: #2E2760;
    --coral: #FF8277; --coral-soft: #522A2D; --gold: #FFC83D; --gold-soft: #4A3A0E; --sky: #6CA8FF; --sky-soft: #1B3560;
    --on-phase: #0E1630; --shadow: 0 6px 0 rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1630; --surface: #18244A; --surface-2: #213059; --ink: #EEF2FF; --ink-soft: #A9B6D8; --line: #2D3C69;
  --good: #43D39A; --bad: #FF7A8E;
  --teal: #3CCFC9; --teal-soft: #17433F; --violet: #A58EFF; --violet-soft: #2E2760;
  --coral: #FF8277; --coral-soft: #522A2D; --gold: #FFC83D; --gold-soft: #4A3A0E; --sky: #6CA8FF; --sky-soft: #1B3560;
  --on-phase: #0E1630; --shadow: 0 6px 0 rgba(0, 0, 0, .35); color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 16px 56px; }
* { box-sizing: border-box; }
.wrap { max-width: 920px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--phase); outline-offset: 2px; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; }
.ar-i { font-family: var(--f-ar); font-size: 1.3em; line-height: 1.2; unicode-bidi: isolate; }
.sz0 { --k: 1; } .sz1 { --k: .74; } .sz2 { --k: .5; } .sz3 { --k: .38; }

#app[data-phase="1"] { --phase: var(--teal); --phase-soft: var(--teal-soft); }
#app[data-phase="2"] { --phase: var(--violet); --phase-soft: var(--violet-soft); }
#app[data-phase="3"] { --phase: var(--coral); --phase-soft: var(--coral-soft); }
#app[data-phase="4"] { --phase: var(--gold); --phase-soft: var(--gold-soft); --on-phase: #14213D; }
#app[data-phase="5"] { --phase: var(--sky); --phase-soft: var(--sky-soft); }

/* En-tête */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { font-family: var(--f-ar); font-size: 2.6rem; line-height: 1; background: var(--phase); color: var(--on-phase); width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.brand h1 { font-family: var(--f-display); font-size: 1.7rem; line-height: 1.1; margin: 0; }
.brand p { margin: 0; color: var(--ink-soft); font-size: .9rem; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: .92rem; }
.seg button[aria-pressed="true"] { background: var(--phase); color: var(--on-phase); }
.stat { font-weight: 800; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; font-size: .92rem; font-variant-numeric: tabular-nums; }
.stat b { color: var(--gold); font-size: 1.05rem; }

/* Phases et semaines */
.phases { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; padding-block: 2px 4px; }
.phase-pill { flex: 0 0 auto; white-space: nowrap; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 8px; font-weight: 800; font-size: .82rem; display: flex; align-items: center; gap: 7px; }
.phase-pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); display: block; }
.phase-pill[aria-current="true"] { background: var(--phase-soft); border-color: var(--c); }
.weeks { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px 10px; scroll-snap-type: x proximity; }
.week-chip { flex: 0 0 auto; scroll-snap-align: start; min-width: 62px; border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 5px 10px 7px; display: flex; flex-direction: column; align-items: center; position: relative; }
.week-chip b { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.1; color: var(--c); }
.week-chip span { font-size: .72rem; color: var(--ink-soft); }
.week-chip[aria-current="true"] { background: var(--phase-soft); border-color: var(--c); }
.week-chip[data-pass="true"]::after { content: "✓"; position: absolute; top: -7px; right: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--good); color: #fff; font-size: .8rem; font-weight: 800; display: grid; place-items: center; }

/* Titre */
.head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--phase); }
.head h2 { font-family: var(--f-display); font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.head p { margin: 0; color: var(--ink-soft); max-width: 66ch; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { background: var(--phase-soft); color: var(--ink); border-radius: 999px; font-size: .8rem; font-weight: 800; padding: 2px 10px; }

.tabs { display: flex; gap: 8px; }
.tab { flex: 1; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 6px; font-family: var(--f-display); font-size: 1.05rem; font-weight: 700; }
.tab[aria-selected="true"] { background: var(--phase); border-color: var(--phase); color: var(--on-phase); box-shadow: var(--shadow); }

/* Jours */
.days { display: flex; flex-wrap: wrap; gap: 8px; }
.day { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 12px; font-weight: 800; position: relative; min-width: 48px; }
.day[aria-selected="true"] { background: var(--phase); border-color: var(--phase); color: var(--on-phase); }
.day[data-done="true"]::after { content: "✓"; position: absolute; top: -8px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--good); color: #fff; font-size: .72rem; display: grid; place-items: center; }
.notion { background: var(--phase-soft); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.notion .lbl { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.notion p { margin: 0; font-weight: 700; }

/* Carte à retourner */
.deck { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.scene { width: 100%; max-width: 480px; perspective: 1200px; }
.card { position: relative; width: 100%; aspect-ratio: 4 / 3; transition: transform .55s cubic-bezier(.3, .7, .3, 1); transform-style: preserve-3d; border: 0; background: none; padding: 0; }
.card[data-flipped="true"] { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; border: 3px solid var(--phase); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px 14px 26px; text-align: center; overflow: hidden; }
.face.back { transform: rotateY(180deg); background: var(--phase-soft); }
.face .big { font-size: calc(clamp(3.2rem, 17vw, 6.4rem) * var(--k, 1)); line-height: 1.45; max-width: 100%; }
.face .hint { position: absolute; bottom: 9px; font-size: .78rem; color: var(--ink-soft); }
.face .pic { font-size: clamp(3.2rem, 15vw, 5rem); line-height: 1.15; }
.face .fr { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; line-height: 1.25; max-width: 28ch; }
.face .ar-small { font-size: 1.7rem; color: var(--ink-soft); line-height: 1.4; max-width: 100%; }
.tag { position: absolute; top: 10px; inset-inline-start: 14px; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 16px; font-weight: 800; min-height: 46px; }
.btn.primary { background: var(--phase); border-color: var(--phase); color: var(--on-phase); box-shadow: var(--shadow); }
.btn.ok { background: var(--good); border-color: var(--good); color: #fff; }
.btn.retry { border-color: var(--coral); color: var(--coral); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: default; }
.counter { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 5.5ch; text-align: center; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 480px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); border: 0; padding: 0; }
.dot[data-known="true"] { background: var(--good); }
.dot[aria-current="true"] { outline: 3px solid var(--phase); outline-offset: 2px; }
.empty { text-align: center; color: var(--ink-soft); padding: 24px 8px; }

.grid-title { font-family: var(--f-display); font-size: 1.15rem; margin: 6px 0 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.mini { border: 2px solid var(--line); border-radius: 16px; background: var(--surface); padding: 8px 6px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.mini .ar { font-size: max(.95rem, calc(1.7rem * var(--k, 1))); line-height: 1.5; max-width: 100%; overflow-wrap: anywhere; text-align: center; }
.mini span.p { font-size: 1.5rem; }
.mini small { color: var(--ink-soft); font-size: .74rem; max-width: 100%; overflow-wrap: anywhere; text-align: center; line-height: 1.25; }
.mini[data-known="true"] { border-color: var(--good); }

/* Panneaux */
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h3 { font-family: var(--f-display); font-size: 1.25rem; margin: 0; }
.panel h4 { font-family: var(--f-display); font-size: 1.05rem; margin: 0; color: var(--phase); }
.panel p { margin: 0; }
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.steps .t { font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--phase); padding-top: 3px; min-width: 6.5em; }
.steps .v { min-width: 0; overflow-wrap: anywhere; }
.tip { background: var(--surface-2); border-radius: 14px; padding: 10px 14px; font-size: .92rem; }
.tip b { color: var(--phase); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }

/* Racines */
.rootword { display: inline-block; direction: rtl; unicode-bidi: isolate; font-family: var(--f-ar); font-size: 2.1rem; line-height: 1.6; }
.rootword mark { background: var(--phase); color: var(--on-phase); border-radius: 6px; }
.pickword { display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: center; gap: 8px; direction: ltr; }
button.ltr { border: 2px solid var(--line); background: var(--surface-2); color: inherit; font-family: var(--f-ar); font-size: 2.4rem; line-height: 1.5; min-width: 2.2rem; min-height: 3.4rem; border-radius: 14px; padding: 0 6px; }
button.ltr[data-sel="true"] { background: var(--gold-soft); border-color: var(--gold); }
button.ltr[data-ok="true"] { background: var(--good); border-color: var(--good); color: #fff; }
button.ltr[data-ok="false"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.family { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.family div { background: var(--surface-2); border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.family small { color: var(--ink-soft); }

/* Jeux */
.gmenu { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.gtile { text-align: start; border: 2px solid var(--line); background: var(--surface); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gtile .gi { font-size: 2rem; line-height: 1.1; }
.gtile b { font-family: var(--f-display); font-size: 1.1rem; }
.gtile small { color: var(--ink-soft); line-height: 1.3; }
.gtile .st { color: var(--gold); letter-spacing: 2px; }
.gtile[data-today="true"] { border-color: var(--phase); background: var(--phase-soft); }
.gtile .today { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--phase); }
.game { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.game h3 { font-family: var(--f-display); font-size: 1.35rem; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.game .how { margin: 0; color: var(--ink-soft); font-size: .95rem; }
.stars { letter-spacing: 2px; color: var(--gold); font-size: 1.1rem; }
.stage { display: flex; flex-direction: column; gap: 12px; align-items: center; min-width: 0; width: 100%; }
.prompt { font-size: calc(clamp(2.6rem, 14vw, 4.6rem) * var(--k, 1)); line-height: 1.5; text-align: center; max-width: 100%; }
.prompt.pic { font-size: clamp(3.6rem, 16vw, 5.4rem); line-height: 1.2; }
.prompt.fr { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
.prompt-label { color: var(--ink-soft); font-weight: 700; text-align: center; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.choices.one { grid-template-columns: minmax(0, 1fr); }
.choice { border: 2px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 12px 8px; min-height: 64px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; overflow-wrap: anywhere; min-width: 0; }
.choice .ar { font-size: max(1rem, calc(1.9rem * var(--k, 1))); line-height: 1.5; }
.choice .pic { font-size: 2rem; }
.choice.right { background: var(--good); border-color: var(--good); color: #fff; }
.choice.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.meter { width: 100%; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--phase); transition: width .3s; }
.msg { font-weight: 800; min-height: 1.5em; text-align: center; }
.msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.result .score { font-family: var(--f-display); font-size: 2.4rem; font-weight: 800; line-height: 1.1; }
.result.pass .score { color: var(--good); }
.timer { font-family: var(--f-display); font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.memo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 520px; }
.tile { aspect-ratio: 1 / 1; border: 2px solid var(--phase); border-radius: 14px; background: var(--phase); color: var(--on-phase); display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; padding: 2px; overflow: hidden; min-width: 0; text-align: center; line-height: 1.15; }
.tile.open { background: var(--surface); color: var(--ink); }
.tile.done { background: var(--phase-soft); border-color: var(--good); color: var(--ink); }
.tile .ar { font-size: max(.8rem, calc(1.5rem * var(--k, 1))); line-height: 1.3; }
.tile .pic { font-size: 2rem; }
.tile .fr { font-size: .72rem; font-weight: 700; overflow-wrap: anywhere; }

.slots { display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 6px; justify-content: center; }
.slot { width: 2.2rem; height: 2.8rem; border-bottom: 4px solid var(--phase); font-family: var(--f-ar); font-size: 2rem; line-height: 2.6rem; text-align: center; }
.keys { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 440px; direction: rtl; }
.key { border: 2px solid var(--line); background: var(--surface-2); border-radius: 10px; font-family: var(--f-ar); font-size: 1.5rem; min-height: 46px; line-height: 1.2; padding: 0; }
.key.hit { background: var(--good); border-color: var(--good); color: #fff; }
.key.miss { background: var(--bad); border-color: var(--bad); color: #fff; opacity: .6; }
.lives { font-size: 1.4rem; letter-spacing: 3px; }
.spelled { display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 8px; justify-content: center; font-family: var(--f-ar); font-size: 2.6rem; line-height: 1.3; }
.spelled span { background: var(--phase-soft); border-radius: 12px; padding: 0 12px; }
.chips { display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 8px; justify-content: center; direction: ltr; min-height: 3.2rem; width: 100%; }
.chip { border: 2px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 4px 12px; font-family: var(--f-ar); font-size: 1.7rem; line-height: 1.6; }
.chip.used { opacity: .25; }
.build { border: 2px dashed var(--phase); border-radius: 18px; padding: 8px; background: var(--phase-soft); }
.reveal { font-size: calc(clamp(2.2rem, 11vw, 3.6rem) * var(--k, 1)); line-height: 1.5; text-align: center; }

/* Suivi */
.tablewrap { overflow-x: auto; border-radius: 16px; border: 2px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; background: var(--surface); }
th, td { padding: 7px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.wrapc { white-space: normal; min-width: 12em; }
th { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; text-align: center; }
.okc { color: var(--good); font-weight: 800; } .noc { color: var(--bad); font-weight: 800; }
.pdot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--line); margin-inline-end: 3px; }
.pdot.on { background: var(--good); }
.fin { font-size: .72rem; font-weight: 800; background: var(--gold-soft); border-radius: 99px; padding: 1px 8px; margin-inline-start: 6px; }
details.panel > summary { cursor: pointer; font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; }
details.panel ul { margin: 6px 0 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.foot { text-align: center; color: var(--ink-soft); font-size: .85rem; }

@media (prefers-reduced-motion: reduce) { .card { transition: none; } .meter i { transition: none; } }
@media (max-width: 420px) { .memo { gap: 6px; } .keys { gap: 4px; } .slot { width: 1.8rem; } .steps li { grid-template-columns: 1fr; } }
</style>
<div class="wrap" id="app" data-phase="1">
  <header class="top">
    <div class="brand">
      <div class="brand-mark ar" aria-hidden="true">أ</div>

const $ = (s, r) => (r || document).querySelector(s);

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const strip = s => s.replace(/[ً-ْـ]/g, "");
const norm = s => strip(s).replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي");
const szOf = ar => { const n = strip(ar).replace(/[\s.؟،]/g, "").length; return n <= 4 ? 0 : n <= 8 ? 1 : n <= 16 ? 2 : 3; };
const rich = t => esc(t).replace(/[؀-ۿ]+(?: +[؀-ۿ]+)*/g, m => `<span class="ar-i" dir="rtl">${m}</span>`);

/* ---------- Semaines : 24 pour les 9 ans, 18 pour les 13 ans ---------- */
const VCACHE = {};
function views() {
  const p = save.p;
  if (VCACHE[p]) return VCACHE[p];
  if (p === "9") return (VCACHE[p] = DATA.units.map(u => ({ key: "a" + u.n, label: "Semaine " + u.n, short: String(u.n), title: u.title, phase: u.phase, theme: u.theme, weeks: [u], s13: u.s13 })));
  const g = {};
  DATA.units.forEach(u => (g[u.s13] = g[u.s13] || []).push(u));
  return (VCACHE[p] = Object.keys(g).map(Number).sort((a, b) => a - b).map(k => ({
    key: "b" + k, label: "Semaine " + k + " (13 ans)", short: "S" + k, title: g[k].map(u => u.title).join(" + "), phase: g[k][0].phase,
    theme: g[k].map(u => u.theme).join(" ; "), weeks: g[k], s13: k })));
}
const state = { vi: 0, day: 1, tab: "cards", game: null, idx: 0, flipped: false, custom: null, draw: {} };
const V = () => views()[state.vi];
const dayOf = (w, d) => w.days.find(x => x.d === d);
const merged = v => v.weeks.length > 1;
const weekCards = v => v.weeks.flatMap(w => w.days.filter(x => x.d <= 5).flatMap(x => x.cards));
const uniq = a => { const s = new Set(); return a.filter(c => { const k = c.ar + "|" + c.fr; if (s.has(k)) return false; s.add(k); return true; }); };
const isKnown = c => !!rec().known[c.id];

function drawFor(v, d) {
  const key = v.key + "-" + d; if (state.draw[key]) return state.draw[key];
  const n = v.weeks[0].n; let pool;
  if (n === 4 && d === 4) {
    const all = DATA.units.filter(u => u.n <= 4).flatMap(u => u.days.filter(x => x.d <= 5).flatMap(x => x.cards)).filter(c => c.k === "word");
    const miss = all.filter(c => !isKnown(c)); pool = shuffle(miss.length >= 5 ? miss : all);
  } else if (n === 24) {
    pool = shuffle(DATA.units.filter(u => u.n >= 19 && u.n <= 23).flatMap(u => u.days.filter(x => x.d <= 4).flatMap(x => x.cards)).filter(c => c.k === "sen"));
  } else pool = shuffle(weekCards(v).filter(c => c.k !== "syl"));
  return (state.draw[key] = pool.slice(0, 5));
}
function dayCards(v, d) {
  if (d === 6 || d === "all") return weekCards(v);
  const c = v.weeks.flatMap(w => dayOf(w, d).cards);
  return c.length ? c : drawFor(v, d);
}
/* Cartes utilisables par un jeu : la semaine d'abord, puis les semaines précédentes si besoin */
function gpool(f, min) {
  let out = uniq(weekCards(V()).filter(f));
  const vs = views();
  for (let i = state.vi - 1; i >= 0 && out.length < min; i--) out = uniq(out.concat(weekCards(vs[i]).filter(f)));
  return out;
}

}

function clusters(ar) { const out = []; for (const ch of ar) { if (/[ً-ْ]/.test(ch) && out.length) out[out.length - 1] += ch; else if (ch !== "ـ" && /[؀-ۿ]/.test(ch)) out.push(ch); } return out; }

  return hit;
}

  const cs = clusters(ar), hit = new Set(rootIdx(ar, letters));
  return cs.map((c, i) => hit.has(i) ? `<mark>${c}</mark>` : c).join("");
}

/* ---------- 1. Associer ---------- */
const qLabel = c => c.k === "syl" ? "Comment se lit cette syllabe ?" : c.k === "sen" ? "Que veut dire cette phrase ?" : "Que veut dire ce mot ?";
function quizStart() {
  const pool = gpool(() => true, 8);
  gs = { id: "quiz", qs: pick(pool, Math.min(10, pool.length)).map(c => {
    const dup = pool.filter(x => x.real && x.img === c.img).length > 1;
    const dir = c.real && !dup && Math.random() < .5 ? "img2ar" : "ar2fr";
    const ok = x => x !== c && x.fr !== c.fr && x.ar !== c.ar;
    let ds = pick(pool.filter(x => ok(x) && x.k === c.k), 3);
    if (ds.length < 3) ds = ds.concat(pick(pool.filter(x => ok(x) && !ds.includes(x)), 3 - ds.length));
    return { card: c, dir, opts: shuffle([c].concat(ds)) }; }), i: 0, score: 0, lock: false };
  quizRender();
}
function quizRender() {

}
function rootRender() {
  const el = gEl(); if (!el) return;
  if (gs.i >= gs.words.length) { const n = gs.words.length, s = gs.first >= n ? 3 : gs.first >= n - 1 ? 2 : gs.first >= 1 ? 1 : 0; award("root", s);
    el.innerHTML = gHead("root") + resultBox(gs.first + " / " + n, s, "Tu repères la racine " + esc(gs.rt.label) + " dans toute la famille !", "r-restart"); return; }
  const w = gs.words[gs.i], cs = clusters(w.ar), hit = new Set(rootIdx(w.ar, gs.rt.letters));
  el.innerHTML = gHead("root") + `<div class="meter"><i style="width:${gs.i / gs.words.length * 100}%"></i></div><div class="stage">
    <div class="prompt-label">Racine ${esc(gs.rt.label)}. Touche les 3 lettres de la racine dans ce mot (${esc(w.fr)}).</div>
    <div class="pickword">${cs.map((c, i) => `<button class="ltr" data-act="r-pick" data-i="${i}" ${gs.res && hit.has(i) ? 'data-ok="true"' : gs.res && gs.sel.includes(i) ? 'data-ok="false"' : gs.sel.includes(i) ? 'data-sel="true"' : ""}>${c}</button>`).join("")}</div>
    <div class="row center">${gs.res ? `<button class="btn primary" data-act="r-next">Mot suivant</button>` : `<button class="btn primary" data-act="r-check" ${gs.sel.length === 3 ? "" : "disabled"}>Vérifier</button>`}</div><div class="msg ${gs.res === "ok" ? "good" : gs.res === "ko" ? "bad" : ""}" id="msg" aria-live="polite">${gs.res === "ok" ? "Bravo !" : gs.res === "ko" ? "Voici les lettres de la racine, en vert." : ""}</div></div>`;
}
function rootPick(i) { if (gs.res) return; const p = gs.sel.indexOf(i); if (p >= 0) gs.sel.splice(p, 1); else if (gs.sel.length < 3) gs.sel.push(i); rootRender(); }
function rootCheck() {
  const hit = rootIdx(gs.words[gs.i].ar, gs.rt.letters), ok = gs.sel.length === 3 && hit.every(i => gs.sel.includes(i));
  if (ok && !gs.tried) gs.first++; gs.res = ok ? "ok" : "ko"; rootRender();
}
function rootNext() { gs.i++; gs.sel = []; gs.res = null; gs.tried = false; rootRender(); }

(function () { const r = rec(); state.vi = Math.min(r.vi || 0, views().length - 1); state.day = 1; renderAll(); })();
</script>
